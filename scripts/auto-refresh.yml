# Copy of .github/workflows/auto-refresh.yml (kept here as a backup).
# If the workflow is ever missing, create .github/workflows/auto-refresh.yml with this content.
name: Auto-refresh site data

on:
  schedule:
    - cron: "23 1 * * *"   # 01:23 UTC = 06:53 IST, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/auto-refresh.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh rates, news and videos
        run: python scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "nriup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data _data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: daily auto-refresh $(date -u +%F)"
          git push
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request skipped"
